<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVENQO — Digital Agency</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #121212;
            --text-main: #ffffff;
            --text-muted: #999999;
            --border-color: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.04) 0%, transparent 40%),
                linear-gradient(135deg, #080808 0%, #141414 50%, #080808 100%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 8%;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-main);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 28px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 8%;
            max-width: 1200px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 550px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            padding: 16px 36px;
            background-color: var(--text-main);
            color: var(--bg-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid var(--text-main);
            transition: all 0.3s ease;
            width: fit-content;
        }

        .btn:hover {
            background-color: transparent;
            color: var(--text-main);
        }

        section {
            padding: 90px 8%;
            border-top: 1px solid var(--border-color);
        }

        .section-header {
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Usługi */
        .services-list {
            display: flex;
            flex-direction: column;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 34px 0;
            border-bottom: 1px solid var(--border-color);
            transition: padding-left 0.3s ease;
        }

        .service-item:hover {
            padding-left: 14px;
        }

        .service-title {
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .service-title span {
            color: var(--text-muted);
            font-weight: 300;
            margin-right: 16px;
        }

        .service-desc {
            color: var(--text-muted);
            max-width: 420px;
            font-size: 0.95rem;
        }

        /* Portfolio / Selected Work */
        .work-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .work-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 240px;
            transition: border-color 0.3s ease;
        }

        .work-card:hover {
            border-color: var(--text-main);
        }

        .work-tag {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .work-card h3 {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .work-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .work-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Insight */
        .insight {
            background-color: var(--bg-card);
            text-align: center;
            padding: 110px 8%;
        }

        .insight blockquote {
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            font-weight: 800;
            text-transform: uppercase;
            max-width: 900px;
            margin: 0 auto 24px auto;
            line-height: 1.2;
        }

        .insight p {
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Kontakt */
        .contact {
            text-align: center;
        }

        .contact h2 {
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .contact p {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1.05rem;
        }

        .email-link {
            display: block;
            font-size: clamp(1.15rem, 3vw, 2rem);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            transition: border-color 0.3s ease;
        }

        .email-link:hover {
            border-color: var(--text-main);
        }

        .cta-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: var(--text-main);
            color: var(--bg-dark);
        }

        footer {
            padding: 40px 8%;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            nav {
                display: none;
            }
            .service-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            footer {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
            footer a {
                margin: 0 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">AVENQO</a>
        <nav>
            <a href="#services">Services</a>
            <a href="#work">Work</a>
            <a href="#about">Philosophy</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <div class="subtitle">AVENQO — DIGITAL AGENCY</div>
            <h1>Your Vision.<br>Our Strategy.</h1>
            <p>We help brands stand out and scale online. Digital growth starts here.</p>
            <a href="#contact" class="btn">Start a Project</a>
        </div>

        <section id="services">
            <div class="section-header">
                <div class="subtitle">Our Expertise</div>
                <h2>What We Do.</h2>
            </div>
